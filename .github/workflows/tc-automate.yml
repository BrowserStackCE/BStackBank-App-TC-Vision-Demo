name: TC Automate Scripts

# Started on demand: from the Actions tab, or from Slack with the /automate command
# (Slack -> Cloudflare Worker -> workflow_dispatch; see slack-relay/README.md).
# Takes the first N not-yet-automated cases from a Test Management folder, writes automation
# for them with Test Companion inside a checkout of the test-suite repo, and raises a PR there.
on:
  workflow_dispatch:
    inputs:
      num_cases:
        description: "How many test cases to automate (first N not-yet-automated cases in the folder)"
        required: true
        default: "2"
      app:
        description: "App: bs://<id> or a custom id. Leave empty to use the TC_APP_ID secret (falls back to BStackBankLatest)"
        required: false
        default: ""
      project:
        description: "Test Management project id"
        required: false
        default: "PR-82"
      folder:
        description: "Test Management folder id"
        required: false
        default: "61028035"
      base_branch:
        description: "Base branch of the test-suite repo for the PR"
        required: false
        default: "main"

concurrency:
  group: tc-automate
  cancel-in-progress: false

permissions:
  contents: read

env:
  TC_PIN_VERSION: "1.1.9"
  TC_SHA256: "09895a6c281c08daf78c0df22f5fdba663875a7a1f522bbb0dff6dcb3fe9c596"
  TEST_REPO: "yashcdev/Test-Companion-Demo-Vision"
  AUTOMATE_BRANCH: "tc/app-automate"
  TM_PROJECT: ${{ github.event.inputs.project || 'PR-82' }}
  TM_FOLDER_ID: ${{ github.event.inputs.folder || '61028035' }}
  NUM_CASES: ${{ github.event.inputs.num_cases || '2' }}
  BASE_BRANCH: ${{ github.event.inputs.base_branch || 'main' }}

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # This repo: scripts/resolve-bs-app.js and the feature context used for the grounding exploration.
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: ci

      # The test suite. tc writes scripts into the folder it runs in, so all tc steps run here.
      - name: Checkout test-suite repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TEST_REPO }}
          token: ${{ secrets.TEST_REPO_TOKEN }}
          ref: ${{ env.BASE_BRANCH }}
          path: suite

      - name: Resolve app id
        id: app
        env:
          INPUT_APP: ${{ github.event.inputs.app }}
          DEFAULT_APP: ${{ secrets.TC_APP_ID }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # Priority: app input > TC_APP_ID secret (already-uploaded bs:// id) > BStackBankLatest
          APP="${INPUT_APP:-${DEFAULT_APP:-BStackBankLatest}}"
          BS_URL="$(node ci/scripts/resolve-bs-app.js "$APP")"
          case "$BS_URL" in bs://*) ;; *) echo "invalid app id: $BS_URL"; exit 1;; esac
          echo "bs_url=$BS_URL" >> "$GITHUB_OUTPUT"
          echo "App: $BS_URL"

      - name: Install tc (pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/tc-install.sh https://test-companion.browserstack.com/cli/install.sh
          TC_VERSION="$TC_PIN_VERSION" sh /tmp/tc-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sign in
        timeout-minutes: 2
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          tc auth login
          tc tm use browserstack

      # The listing has no automation status, so the CLI is the source of truth: it refuses a case
      # that is already automated. Candidates are tried in listed order (oldest id first).
      - name: List candidate cases
        id: list
        working-directory: suite
        run: |
          set -euo pipefail
          tc tm cases -p "$TM_PROJECT" -f "$TM_FOLDER_ID" --json > ../tm-cases.json
          echo "--- raw listing (first 3000 chars) ---"; head -c 3000 ../tm-cases.json; echo
          node -e '
            const fs = require("fs");
            let data = JSON.parse(fs.readFileSync("../tm-cases.json", "utf8"));
            if (!Array.isArray(data)) data = data.test_cases || data.cases || data.data || [];
            const num = (c) => parseInt(String(c.identifier || c.id || "").replace(/\D/g, ""), 10) || 0;
            data.sort((a, b) => num(a) - num(b));
            const lines = data.map((c) => `${c.identifier || c.id}\t${c.name || c.title || ""}`);
            fs.writeFileSync("../candidates.tsv", lines.join("\n") + "\n");
          '
          test -s ../candidates.tsv || { echo "No test cases in $TM_PROJECT / $TM_FOLDER_ID"; exit 1; }
          echo "Candidates: $(wc -l < ../candidates.tsv)"

      # Automate cases one at a time until NUM_CASES are written. A case that is already automated is
      # skipped. The device exploration that grounds selectors runs once, on the first case that is
      # actually being automated, and only for that case (not the whole feature context).
      - name: Write automation scripts
        id: automate
        working-directory: suite
        env:
          BS_URL: ${{ steps.app.outputs.bs_url }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          set -uo pipefail
          DONE=""
          COUNT=0
          GROUNDED=0
          while IFS=$'\t' read -r ID NAME; do
            [ -z "$ID" ] && continue
            [ "$COUNT" -ge "$NUM_CASES" ] && break

            # Ground selectors on the device for the case about to be automated.
            if [ "$GROUNDED" -eq 0 ]; then
              echo "=== Grounding selectors for $ID: $NAME ==="
              GROUND="Explore the app on the real device only to capture verified on-device elements needed to automate this test case: ${ID} - ${NAME}. Do not save, create or modify any test case."
              tc app generate --app "$BS_URL" --platform android --auto-grant-permissions \
                --yolo --json "$GROUND" 2>&1 | tee -a ../tc-ground.log
              gcode=${PIPESTATUS[0]}
              if [ "$gcode" -ne 0 ]; then
                echo "Grounding exploration failed (exit $gcode); stopping so scripts are not written with ungrounded selectors."
                exit "$gcode"
              fi
              GROUNDED=1
            fi

            echo "=== Automating $ID: $NAME ==="
            tc automate "$ID" --project "$TM_PROJECT" --app "$BS_URL" --platform android \
              --yolo --json 2>&1 | tee -a ../tc-automate.log
            code=${PIPESTATUS[0]}
            if [ "$code" -eq 0 ]; then
              DONE="${DONE:+$DONE }$ID"
              COUNT=$((COUNT + 1))
            elif tail -n 40 ../tc-automate.log | grep -q "Already automated"; then
              echo "Skipping $ID (already automated)"
            else
              echo "tc automate failed for $ID (exit $code)"
              exit "$code"
            fi
          done < ../candidates.tsv

          # Every case already automated is a successful outcome: nothing to do, no PR.
          if [ "$COUNT" -eq 0 ]; then
            echo "All cases in $TM_PROJECT / $TM_FOLDER_ID are already automated. Nothing to do."
            echo "nothing_to_do=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$COUNT" -lt "$NUM_CASES" ]; then echo "::warning::Only $COUNT of $NUM_CASES requested cases could be automated (the rest are already automated)."; fi
          echo "Automated: $DONE"
          echo "ids=$DONE" >> "$GITHUB_OUTPUT"
          echo "nothing_to_do=false" >> "$GITHUB_OUTPUT"

      - name: Raise PR in the test-suite repo
        id: pr
        if: steps.automate.outputs.nothing_to_do != 'true'
        working-directory: suite
        env:
          GH_TOKEN: ${{ secrets.TEST_REPO_TOKEN }}
          IDS: ${{ steps.automate.outputs.ids }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then echo "No new files were written, nothing to commit."; exit 1; fi
          BRANCH="$AUTOMATE_BRANCH"
          git config user.name "tc-automate[bot]"
          git config user.email "tc-automate@users.noreply.github.com"

          # Run output, not a deliverable. Excluded locally so it is never committed.
          printf '%s\n' 'log/' >> .git/info/exclude

          # Commit on a local branch first (no stash), then put it on top of the shared branch if it exists.
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "feat: add Test Companion automation for ${IDS}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git rebase -X theirs "origin/$BRANCH" || { git rebase --abort; echo "Could not rebase onto origin/$BRANCH"; exit 1; }
          fi
          git push origin "$BRANCH"

          # Reuse the open PR for this branch if there is one, else open it.
          PR_URL="$(gh pr list --repo "$TEST_REPO" --head "$BRANCH" --base "$BASE_BRANCH" --state open --json url --jq '.[0].url')"
          if [ -n "$PR_URL" ]; then
            echo "PR already open, new commit added to it: $PR_URL"
          else
            PR_URL="$(gh pr create --repo "$TEST_REPO" --base "$BASE_BRANCH" --head "$BRANCH" \
              --title "Test Companion: automated test scripts" \
              --body "Automation generated by Test Companion (project ${TM_PROJECT}, folder ${TM_FOLDER_ID}). Latest cases: ${IDS}.

          Workflow run: ${RUN_URL}")"
            echo "Opened: $PR_URL"
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          NOTHING_TO_DO: ${{ steps.automate.outputs.nothing_to_do }}
          IDS: ${{ steps.automate.outputs.ids }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then echo "SLACK_WEBHOOK_URL not set, skipping"; exit 0; fi
          if [ "$JOB_STATUS" = "success" ]; then ICON=":white_check_mark:"; else ICON=":x:"; fi
          if [ "$NOTHING_TO_DO" = "true" ]; then
            TEXT="${ICON} Test Companion script generation: ${JOB_STATUS}
          All cases in ${TM_PROJECT} / ${TM_FOLDER_ID} are already automated, nothing to generate.
          Run: ${RUN_URL}"
          else
            TEXT="${ICON} Test Companion script generation: ${JOB_STATUS}
          Cases: ${IDS:-none selected} (${TM_PROJECT} / ${TM_FOLDER_ID})
          PR: ${PR_URL:-none}
          Run: ${RUN_URL}"
          fi
          PAYLOAD="$(node -e 'console.log(JSON.stringify({text: process.argv[1]}))' "$TEXT")"
          curl -fsS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tc-automate-logs
          path: |
            tc-ground.log
            tc-automate.log
            tm-cases.json
            candidates.tsv
          if-no-files-found: ignore
          retention-days: 7

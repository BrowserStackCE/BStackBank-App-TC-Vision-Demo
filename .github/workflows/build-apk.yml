name: Build release APK

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    outputs:
      bs_url: ${{ steps.appautomate.outputs.bs_url }}
      custom_id: ${{ steps.appautomate.outputs.custom_id }}
      apk_name: ${{ steps.apk.outputs.name }}
    # Only when: PR was MERGED, from branch pr/workflow, and title starts with "feat(dev): "
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'pr/workflow' &&
      startsWith(github.event.pull_request.title, 'feat(dev): ')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      # Ubuntu runners already include the Android SDK; pin JDK 17 (cached, fast).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Bump app version to 2.0.1
        run: |
          node -e "
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('app.json','utf8'));
          j.expo.version='2.0.1';
          fs.writeFileSync('app.json',JSON.stringify(j,null,2)+'\n');
          console.log('version ->', j.expo.version);"

      - name: Create .env from secrets
        env:
          EXPO_PUBLIC_STRIPE_PK: ${{ secrets.EXPO_PUBLIC_STRIPE_PK }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          EXPO_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.EXPO_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
        run: |
          {
            echo "EXPO_PUBLIC_STRIPE_PK=$EXPO_PUBLIC_STRIPE_PK"
            echo "EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL"
            echo "EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME=$EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME"
            echo "EXPO_PUBLIC_CLOUDINARY_UPLOAD_PRESET=$EXPO_PUBLIC_CLOUDINARY_UPLOAD_PRESET"
          } > .env

      # /android is git-ignored (generated), so regenerate it.
      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: set -a && source ../.env && set +a && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Rename APK
        id: apk
        run: |
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          NAME="BStackBank-2.0.1-${{ github.event.pull_request.number }}-$(date +%Y%m%d-%H%M).apk"
          cp "$SRC" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Stable custom id: re-uploads keep the same name, so later flows can always find the latest build.
      - name: Upload APK to BrowserStack App Automate
        id: appautomate
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: node scripts/upload-to-appautomate.js "${{ steps.apk.outputs.name }}" "BStackBankLatest"

      - name: Upload APK to Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: node scripts/upload-to-drive.js "${{ steps.apk.outputs.name }}"

      # Handoff for the exploration flow: BS app id + feature context from the repo.
      - name: Write handoff file
        env:
          BS_URL: ${{ steps.appautomate.outputs.bs_url }}
          CUSTOM_ID: ${{ steps.appautomate.outputs.custom_id }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          mkdir -p handoff
          cp .github/tc-context/feature-context.md handoff/feature-context.md
          node -e '
          const fs=require("fs"), e=process.env;
          fs.writeFileSync("handoff/handoff.json", JSON.stringify({
            bs_url:e.BS_URL, custom_id:e.CUSTOM_ID, apk_name:e.APK_NAME,
            pr_number:e.PR_NUMBER, pr_title:e.PR_TITLE, sha:e.MERGE_SHA
          },null,2)+"\n");'
          cat handoff/handoff.json

      - uses: actions/upload-artifact@v4
        with:
          name: tc-handoff
          path: handoff/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 7

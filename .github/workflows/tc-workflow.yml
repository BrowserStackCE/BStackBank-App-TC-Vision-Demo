name: tc-workflow

# Runs after "Build release APK" completes successfully, or manually (workflow_dispatch).
# Reads the tc-handoff artifact (bs:// app id + feature context), explores the app on a real
# Android device with Test Companion, and saves the generated cases to Test Management.
on:
  workflow_run:
    workflows: ["Build release APK"]
    types: [completed]
  workflow_dispatch:
    inputs:
      app:
        description: "App to explore: bs://<id> or a custom id. Leave empty to use the TC_APP_ID secret (falls back to BStackBankLatest)"
        required: false
        default: ""
      device:
        description: "Device name (default Google Pixel 9; OS version is chosen by Test Companion)"
        required: false
        default: "Google Pixel 9"
      os_version:
        description: "OS version (only used together with a device)"
        required: false
        default: ""
      instructions:
        description: "Extra instructions appended to the feature context (optional)"
        required: false
        default: ""

concurrency:
  group: tc-workflow
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # needed to download the artifact from the build run

env:
  TC_PIN_VERSION: "1.1.9"
  # sha256 of the linux-x64 release tarball for 1.1.9 (ubuntu runners)
  # From 1.1.8, --device and --os-version are accepted but ignored: app runs use Test Companion's device pool.
  TC_SHA256: "09895a6c281c08daf78c0df22f5fdba663875a7a1f522bbb0dff6dcb3fe9c596"
  TM_PROJECT: "PR-79"                     # Test-Companion-Demo-Vision
  TM_FOLDER_NAME: "Functional"
  TM_FOLDER_ID: "60003370"
  # workflow_run (auto) has no inputs, so fall back to Google Pixel 9. OS version stays empty.
  DEVICE: ${{ github.event.inputs.device || 'Google Pixel 9' }}
  OS_VERSION: ${{ github.event.inputs.os_version }}

jobs:
  explore:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # --- Automatic path: take the app id and context from the build run ---
      - name: Download handoff from the build run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: tc-handoff
          path: handoff
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # --- Manual path: use the repo's current feature context and the chosen app ---
      - name: Checkout (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Read handoff
        id: handoff
        env:
          EVENT: ${{ github.event_name }}
          INPUT_APP: ${{ github.event.inputs.app }}
          DEFAULT_APP: ${{ secrets.TC_APP_ID }}
          EXTRA: ${{ github.event.inputs.instructions }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p handoff
          if [ "$EVENT" = "workflow_dispatch" ]; then
            cp .github/tc-context/feature-context.md handoff/feature-context.md
            # Priority: app input > TC_APP_ID secret (already-uploaded bs:// id) > BStackBankLatest
            APP="${INPUT_APP:-${DEFAULT_APP:-BStackBankLatest}}"
            BS_URL="$(node scripts/resolve-bs-app.js "$APP")"
            PR_NUMBER="manual"
            if [ -n "$EXTRA" ]; then printf '\n\n## Extra instructions\n%s\n' "$EXTRA" >> handoff/feature-context.md; fi
          else
            test -s handoff/handoff.json || { echo "handoff.json missing"; exit 1; }
            BS_URL=$(node -p "require('./handoff/handoff.json').bs_url")
            PR_NUMBER=$(node -p "require('./handoff/handoff.json').pr_number")
          fi
          test -s handoff/feature-context.md || { echo "feature-context.md missing"; exit 1; }
          case "$BS_URL" in bs://*) ;; *) echo "invalid app id: $BS_URL"; exit 1;; esac
          echo "bs_url=$BS_URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "App: $BS_URL (PR $PR_NUMBER), device: ${DEVICE:-auto} ${OS_VERSION}"

      - name: Install tc (pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/tc-install.sh https://test-companion.browserstack.com/cli/install.sh
          TC_VERSION="$TC_PIN_VERSION" sh /tmp/tc-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sign in
        timeout-minutes: 2
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          tc auth login
          tc tm use browserstack

      - name: Explore app and generate test cases
        env:
          BS_URL: ${{ steps.handoff.outputs.bs_url }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          set -uo pipefail
          CTX="$(cat handoff/feature-context.md)"
          INSTRUCTIONS="Save every generated test case to Test Management project ${TM_PROJECT} (Test-Companion-Demo-Vision), inside the existing folder ${TM_FOLDER_NAME} (folder id ${TM_FOLDER_ID}). Do not create a new project and do not use the Automation folders.
          Write manual, step-based test cases only (a title, preconditions, numbered steps, and one clear expected result per step). Do not generate automation scripts or file names.
          You MUST explore the feature on the real device and base every test case on what you actually observed. If the device session cannot be started or is lost, STOP and report failure. Never write test cases from the description alone and never save unverified cases.

          ${CTX}"

          DEVICE_ARGS=()
          if [ -n "${DEVICE:-}" ]; then DEVICE_ARGS+=(--device "$DEVICE"); fi
          if [ -n "${DEVICE:-}" ] && [ -n "${OS_VERSION:-}" ]; then DEVICE_ARGS+=(--os-version "$OS_VERSION"); fi


          # Retry only when the device session itself failed.
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt (device: ${DEVICE:-auto}) ==="
            tc app generate --app "$BS_URL" --platform android ${DEVICE_ARGS[@]+"${DEVICE_ARGS[@]}"} \
              --auto-grant-permissions --save-to-tm --tm-project "$TM_PROJECT" --tm-folder "$TM_FOLDER_ID" \
              --yolo --json "$INSTRUCTIONS" 2>&1 | tee "tc-run-$attempt.log"
            code=${PIPESTATUS[0]}
            if grep -qE 'Session liveness check failed|session crashed/terminated|No active Appium session|task_blocked|could not be started|no longer available on BrowserStack|not one of the devices provided' "tc-run-$attempt.log"; then
              echo "Device session failed on attempt $attempt (exit $code): the session died at start. Likely causes: device unavailable, app crashing on launch, or no free parallels. Check the session in the App Automate dashboard."
              continue
            fi
            exit "$code"
          done
          echo "Exploration did not complete after 3 attempts. Nothing was verified or saved."
          exit 7

      - name: Write run summary
        if: always()
        env:
          BS_URL: ${{ steps.handoff.outputs.bs_url }}
          PR_NUMBER: ${{ steps.handoff.outputs.pr_number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Test Companion exploration"
            echo "- Result: ${JOB_STATUS}"
            echo "- App: ${BS_URL}"
            echo "- PR: ${PR_NUMBER}"
            echo "- Device: ${DEVICE:-auto} ${OS_VERSION}"
            echo "- Test Management: project ${TM_PROJECT}, folder ${TM_FOLDER_NAME} (${TM_FOLDER_ID})"
          } > tc-summary.md
          cat tc-summary.md >> "$GITHUB_STEP_SUMMARY"
          tc tm cases -p "$TM_PROJECT" -f "$TM_FOLDER_ID" 2>&1 | head -40 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BS_URL: ${{ steps.handoff.outputs.bs_url }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then echo "SLACK_WEBHOOK_URL not set, skipping"; exit 0; fi
          FOLDER_URL="https://test-management.browserstack.com/projects/${TM_PROJECT}/folder/${TM_FOLDER_ID}/test-cases"
          if [ "$JOB_STATUS" = "success" ]; then ICON=":white_check_mark:"; else ICON=":x:"; fi
          TEXT="${ICON} Test Companion exploration: ${JOB_STATUS}
          App: ${BS_URL}
          Test Management: ${TM_PROJECT} / ${TM_FOLDER_NAME} (${TM_FOLDER_ID}) - ${FOLDER_URL}
          Run: ${RUN_URL}"
          PAYLOAD="$(node -e 'console.log(JSON.stringify({text: process.argv[1]}))' "$TEXT")"
          curl -fsS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tc-workflow-logs
          path: |
            tc-run-*.log
            tc-summary.md
          if-no-files-found: ignore
          retention-days: 7

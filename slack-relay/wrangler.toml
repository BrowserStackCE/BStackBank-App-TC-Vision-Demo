name = "slack-automate-relay"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
GITHUB_REPO = "BrowserStackCE/BStackBank-App-TC-Vision-Demo"
WORKFLOW_FILE = "tc-automate.yml"
REF = "main"
# Comma-separated Slack member IDs allowed to run /automate (empty = anyone in the workspace).
ALLOWED_SLACK_USER_IDS = "U0APG04K4D9"

# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put SLACK_SIGNING_SECRET
#   npx wrangler secret put GITHUB_TOKEN
